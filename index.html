<!doctype html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>首頁</title>
	<style>
		:root {
			--bg1: #fef3c7;
			--bg2: #dbeafe;
			--card: #ffffff;
			--text: #1f2937;
			--btn: #0f766e;
			--btn-hover: #115e59;
		}

		* { box-sizing: border-box; }

		body {
			margin: 0;
			min-height: 100vh;
			display: grid;
			place-items: center;
			font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
			color: var(--text);
			background: linear-gradient(135deg, var(--bg1), var(--bg2));
		}

		.card {
			width: min(640px, 92vw);
			background: var(--card);
			border-radius: 16px;
			padding: 28px;
			text-align: center;
			box-shadow: 0 14px 34px rgba(31, 41, 55, 0.16);
		}

		h1 {
			margin: 0 0 10px;
			font-size: clamp(1.6rem, 4vw, 2.2rem);
		}

		p {
			margin: 0 0 20px;
			color: #4b5563;
			line-height: 1.6;
		}

		.link-btn {
			display: inline-block;
			padding: 12px 18px;
			border-radius: 10px;
			text-decoration: none;
			color: #fff;
			background: var(--btn);
			font-weight: 700;
			transition: background 120ms ease, transform 120ms ease;
		}

		.link-btn:hover {
			background: var(--btn-hover);
			transform: translateY(-1px);
		}
	</style>
</head>
<body>
	<main class="card">
		<h1>歡迎來到排序法學習網站</h1>
		<p>點擊下方按鈕，進入即時動畫的排序法介紹頁面。</p>
		<a class="link-btn" href="0310.html">前往 0310 排序法頁面</a>
	</main>
</body>
</html>
